# Ambiente de DESARROLLO: codigo montado como volumen con recarga automatica, Postgres expuesto solo en localhost.
# La carta queda en http://localhost:3000 (frontend; la API se alcanza por el mismo origen en /api).
services:
  db:
    env_file: .env.dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  backend:
    env_file: .env.dev
    command: ["node", "--watch", "src/server.js"]
    volumes:
      - ./src:/app/src:ro
      - ./db:/app/db:ro
      - ./scripts:/app/scripts:ro

  frontend:
    ports:
      - "3000:8080"
    volumes:
      - ./frontend/public:/usr/share/nginx/html:ro

volumes:
  pgdata_dev: {}
