AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Carta Digital PNK - DATOS PERSISTENTES: RDS PostgreSQL 17 (privada, TLS), EFS (fotos) y los secretos con las claves
  iniciales. Es un stack aparte de la aplicacion (carta-digital.yaml) para que borrar y volver a desplegar el ambiente NO
  destruya la base de datos. Lo crea infra/aws/desplegar.sh solo si no existe; infra/aws/destruir.sh lo conserva
  (se borra unicamente con TODO=1).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
  Subred1:
    Type: AWS::EC2::Subnet::Id
  Subred2:
    Type: AWS::EC2::Subnet::Id
    Description: Subred en OTRA zona de disponibilidad (RDS y EFS exigen 2 zonas).
  NombreApp:
    Type: String
    Default: carta-digital
    Description: Nombre del stack de la aplicacion; la BD se llama <NombreApp>-bd (las instancias la buscan con ese identificador).
  ClaseBd:
    Type: String
    Default: db.t3.micro
    AllowedValues: [db.t3.micro, db.t3.small, db.t4g.micro]
  VersionPostgres:
    Type: String
    Default: '17.6'
    AllowedPattern: '^17\.[0-9]+$'
    Description: Version menor de PostgreSQL 17 (desplegar.sh usa la vigente por defecto en RDS al crear la BD).

Resources:
  # ---------------- Secretos (generados por AWS; viven con la BD porque las cuentas ya sembradas usan estas claves) ----------------
  SecretoBd:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Usuario y clave de RDS (carta digital)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"pnk_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  # Rol de la APLICACION con minimo privilegio (lo crea scripts/preparar-bd.js con el usuario maestro).
  SecretoBdApp:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Usuario y clave del rol de la app en RDS (sin DDL ni privilegios de administracion)
      GenerateSecretString:
        SecretStringTemplate: '{"username":"carta_app"}'
        GenerateStringKey: password
        PasswordLength: 32
        ExcludePunctuation: true

  SecretoAdmin:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Clave inicial de admin@gmail.com (solo se usa si la cuenta no existe)
      GenerateSecretString:
        SecretStringTemplate: '{"email":"admin@gmail.com"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludePunctuation: true

  SecretoAdmin2:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Clave inicial de admin.bahia@gmail.com (administrador del restaurante 2; solo se usa si la cuenta no existe)
      GenerateSecretString:
        SecretStringTemplate: '{"email":"admin.bahia@gmail.com"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludePunctuation: true

  SecretoCliente:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Clave inicial de alondra@gmail.com
      GenerateSecretString:
        SecretStringTemplate: '{"email":"alondra@gmail.com"}'
        GenerateStringKey: password
        PasswordLength: 20
        ExcludePunctuation: true

  # ---------------- Security Groups de los datos (las reglas desde el backend las agrega el stack de la app) ----------------
  SgBd:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL - solo desde el backend
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-sg-bd' }]

  SgEfs:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: EFS - NFS solo desde el backend
      VpcId: !Ref VpcId
      Tags: [{ Key: Name, Value: !Sub '${AWS::StackName}-sg-efs' }]

  # ---------------- Base de datos: RDS PostgreSQL 17, privada, cifrada, TLS obligatorio ----------------
  GrupoSubredesBd:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Subredes de la BD de la carta digital
      SubnetIds: [!Ref Subred1, !Ref Subred2]

  BaseDatos:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      DBInstanceIdentifier: !Sub '${NombreApp}-bd'
      Engine: postgres
      EngineVersion: !Ref VersionPostgres
      DBInstanceClass: !Ref ClaseBd
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      DBName: pnk_carta
      MasterUsername: !Sub '{{resolve:secretsmanager:${SecretoBd}:SecretString:username}}'
      MasterUserPassword: !Sub '{{resolve:secretsmanager:${SecretoBd}:SecretString:password}}'
      DBSubnetGroupName: !Ref GrupoSubredesBd
      VPCSecurityGroups: [!Ref SgBd]
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 1
      DeletionProtection: false
      AutoMinorVersionUpgrade: true

  # ---------------- Fotos del panel: EFS compartido por todas las instancias ----------------
  ArchivosEfs:
    Type: AWS::EFS::FileSystem
    DeletionPolicy: Delete
    Properties:
      Encrypted: true
      PerformanceMode: generalPurpose
      FileSystemTags: [{ Key: Name, Value: !Sub '${AWS::StackName}-fotos' }]

  MontajeEfs1:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ArchivosEfs
      SubnetId: !Ref Subred1
      SecurityGroups: [!Ref SgEfs]

  MontajeEfs2:
    Type: AWS::EFS::MountTarget
    Properties:
      FileSystemId: !Ref ArchivosEfs
      SubnetId: !Ref Subred2
      SecurityGroups: [!Ref SgEfs]

Outputs:
  SecretoBd:
    Value: !Ref SecretoBd
  SecretoBdApp:
    Value: !Ref SecretoBdApp
  SecretoAdmin:
    Value: !Ref SecretoAdmin
  SecretoAdmin2:
    Value: !Ref SecretoAdmin2
  SecretoCliente:
    Value: !Ref SecretoCliente
  ArchivosEfs:
    Value: !Ref ArchivosEfs
  SgBd:
    Value: !GetAtt SgBd.GroupId
  SgEfs:
    Value: !GetAtt SgEfs.GroupId
  EndpointBd:
    Value: !GetAtt BaseDatos.Endpoint.Address
