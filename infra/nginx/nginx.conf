# nginx delante de la carta (EC2 unica): termina TLS y enruta como el ALB de AWS: /api y /uploads al backend, el resto al
# frontend. Ningun servicio publica puertos salvo este.
# La redireccion HTTP -> HTTPS la hace la propia app (FORCE_HTTPS=1 + PUBLIC_HOST), asi el destino nunca sale de la cabecera Host del cliente.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  client_max_body_size 3m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;

  # Limites adicionales a los de la app (capa extra contra fuerza bruta y abuso)
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_status 429;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # Detras de Cloudflare Tunnel: la IP real del visitante llega en CF-Connecting-IP, y solo se acepta si la conexion viene de la
  # red interna de Docker (cloudflared). Una peticion directa desde internet no puede falsificarla.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  upstream backend  { server backend:3000; keepalive 16; }
  upstream frontend { server frontend:8080; keepalive 16; }

  map $http_upgrade $conn { default ""; }

  server {
    listen 80 default_server;
    location ~ ^/(api|uploads)/ {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://backend;
    }
    # Las paginas por HTTP pasan a HTTPS. $host solo afecta al propio visitante (no hay cache compartida).
    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/certs/carta.crt;
    ssl_certificate_key /etc/nginx/certs/carta.key;

    location = /api/login {
      limit_req zone=login burst=5 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://backend;
    }
    # Salud del backend (la usan Jenkins y el health check): misma ruta que antes.
    location = /health {
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://backend;
    }
    location ~ ^/(api|uploads)/ {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://backend;
    }
    location / {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://frontend;
    }
  }
}
