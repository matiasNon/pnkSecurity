# nginx delante de la app: termina TLS y reenvia a la app (que no publica puertos).
# La redireccion HTTP -> HTTPS la hace la propia app (FORCE_HTTPS=1 + PUBLIC_HOST), asi el destino nunca sale de la cabecera Host del cliente.
worker_processes auto;
pid /tmp/nginx.pid;
events { worker_connections 1024; }

http {
  server_tokens off;
  include /etc/nginx/mime.types;
  client_max_body_size 3m;
  client_body_timeout 15s;
  client_header_timeout 15s;
  keepalive_timeout 30s;

  # Limites adicionales a los de la app (capa extra contra fuerza bruta y abuso)
  limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
  limit_req_zone $binary_remote_addr zone=general:10m rate=20r/s;
  limit_req_status 429;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_timeout 1d;
  ssl_session_cache shared:SSL:10m;
  ssl_session_tickets off;

  # Detras de Cloudflare Tunnel: la IP real del visitante llega en CF-Connecting-IP, y solo se acepta si la conexion viene de la
  # red interna de Docker (cloudflared). Una peticion directa desde internet no puede falsificarla.
  set_real_ip_from 172.16.0.0/12;
  real_ip_header CF-Connecting-IP;

  upstream carta { server app:3000; keepalive 16; }

  map $http_upgrade $conn { default ""; }

  server {
    listen 80 default_server;
    location / {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://carta;
    }
  }

  server {
    listen 443 ssl default_server;
    ssl_certificate     /etc/nginx/certs/carta.crt;
    ssl_certificate_key /etc/nginx/certs/carta.key;

    location = /login {
      limit_req zone=login burst=5 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://carta;
    }
    location / {
      limit_req zone=general burst=40 nodelay;
      include /etc/nginx/proxy.conf;
      proxy_set_header X-Forwarded-Proto https;
      proxy_pass http://carta;
    }
  }
}
