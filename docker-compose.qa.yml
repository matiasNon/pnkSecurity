# Ambiente de QA: BD EFIMERA (tmpfs, se recrea con la migracion en cada ejecucion), imagenes iguales a las de produccion
# y servicios de prueba. Se ejecuta con scripts/qa.sh (o a mano):
#   docker compose -f docker-compose.yml -f docker-compose.qa.yml run --rm tests   # API (Jest + Supertest)
#   docker compose -f docker-compose.yml -f docker-compose.qa.yml run --rm e2e     # navegador real (Playwright) -> frontend
services:
  db:
    env_file: .env.qa
    tmpfs:
      - /var/lib/postgresql/data

  backend:
    env_file: .env.qa

  frontend:
    networks:
      interna:
        # Alias distinto de "app": ".app" es un TLD con HSTS precargado y Chromium forzaria HTTPS.
        aliases: [carta]

  tests:
    build:
      context: .
      target: test
    env_file: .env.qa
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      UPLOAD_DIR: /tmp/uploads
    volumes:
      - ./reports:/app/reports
    networks: [interna]

  e2e:
    build:
      context: .
      target: e2e
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      BASE_URL: http://carta:8080
      EVIDENCIA_DIR: /evidencia
    volumes:
      - ./reports:/app/reports
      - ./docs/evidencias/qa:/evidencia
    networks: [interna]
