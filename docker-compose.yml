# Base comun a los tres ambientes. Se usa siempre junto a un archivo de ambiente:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.qa.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [interna]

  app:
    build:
      context: .
      target: runtime
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTO_MIGRATE: "1"
      DB_HOST: db
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    networks: [interna]

networks:
  interna: {}

volumes:
  uploads: {}
