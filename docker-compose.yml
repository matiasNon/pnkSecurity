# Base comun a los ambientes locales. Tres servicios separados:
#   db       PostgreSQL 17 (en AWS se reemplaza por Amazon RDS)
#   backend  API REST (Node.js + Express), solo en la red interna
#   frontend paginas estaticas (nginx); reenvia /api y /uploads al backend (en AWS lo hace el ALB)
# Se usa siempre junto a un archivo de ambiente:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   docker compose -f docker-compose.yml -f docker-compose.qa.yml up --build --abort-on-container-exit
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [interna]

  backend:
    build:
      context: .
      target: runtime
    image: carta-backend:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      AUTO_MIGRATE: "1"
      DB_HOST: db
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    networks: [interna]

  frontend:
    build:
      context: ./frontend
      target: local
    image: carta-frontend:local
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [interna]

networks:
  interna: {}

volumes:
  uploads: {}
