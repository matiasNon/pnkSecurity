# Ambiente de PRODUCCION: imagen inmutable, sistema de archivos de solo lectura, sin puertos publicados salvo nginx (80/443).
# Requiere .env.prod (copiar de .env.prod.example) y infra/certs/carta.{crt,key} (infra/generar-certificado.sh).
services:
  db:
    env_file: .env.prod
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]

  app:
    env_file: .env.prod
    environment:
      TRUST_PROXY: "1"
      FORCE_HTTPS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/proxy.conf:/etc/nginx/proxy.conf:ro
      - ./infra/certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt: ["no-new-privileges:true"]
    networks: [interna]

volumes:
  pgdata_prod: {}
