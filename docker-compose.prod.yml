# Ambiente de PRODUCCION: imagen inmutable, sistema de archivos de solo lectura, sin puertos publicados salvo nginx (80/443).
# Requiere .env.prod (copiar de .env.prod.example) y el certificado en el volumen pnk-prod-certs
# (bash infra/generar-certificado.sh <IP> && bash infra/cargar-certificado.sh).
services:
  db:
    env_file: .env.prod
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    security_opt: ["no-new-privileges:true"]

  app:
    env_file: .env.prod
    environment:
      TRUST_PROXY: "1"
      FORCE_HTTPS: "1"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits:
          memory: 512M

  nginx:
    build: ./infra/nginx
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certs:/etc/nginx/certs:ro
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    security_opt: ["no-new-privileges:true"]
    networks: [interna]

volumes:
  pgdata_prod: {}
  certs:
    external: true
    name: pnk-prod-certs
