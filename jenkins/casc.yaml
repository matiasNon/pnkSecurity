# Jenkins Configuration as Code: la instancia se crea ya configurada (usuario, job y herramientas), sin pasos manuales.
jenkins:
  systemMessage: "Pipeline de la carta digital PNK (INACAP La Serena) - filtro de seguridad OWASP / MITRE"
  numExecutors: 1   # un build a la vez: las tres ramas comparten el ambiente QA efimero
  securityRealm:
    local:
      allowsSignup: false
      users:
        - id: "admin"
          password: "${JENKINS_ADMIN_PASSWORD}"
  authorizationStrategy:
    loggedInUsersCanDoAnything:
      allowAnonymousRead: false
unclassified:
  location:
    url: "${JENKINS_URL:-http://localhost:8081/}"
jobs:
  - script: >
      multibranchPipelineJob('carta-digital') {
        description('Ramas: carta-digital-node (desarrollo), qa y produccion. Solo "produccion" despliega, y unicamente si pasan todos los filtros.')
        branchSources {
          branchSource {
            source {
              git {
                id('carta-digital')
                remote("${REPO_URL}")
                traits { gitBranchDiscovery() }
              }
            }
          }
        }
        factory { workflowBranchProjectFactory { scriptPath('Jenkinsfile') } }
        orphanedItemStrategy { discardOldItems { numToKeep(10) } }
        triggers { periodicFolderTrigger { interval('5m') } }
      }
