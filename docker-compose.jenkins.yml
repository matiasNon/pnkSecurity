# Jenkins para la 4.a entrega. Levantar:  JENKINS_ADMIN_PASSWORD=... REPO_URL=... docker compose -f docker-compose.jenkins.yml up -d --build
# Abrir http://localhost:8081 (usuario admin). Los secretos de produccion viven en el volumen de Jenkins (carpeta pnk-secretos), nunca en el repo.
services:
  jenkins:
    build: ./jenkins
    container_name: pnk-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "${JENKINS_PORT:-8081}:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?defina JENKINS_ADMIN_PASSWORD}
      REPO_URL: ${REPO_URL:-https://github.com/matiasNon/pnkSecurity.git}
      # Solo para probar con un repositorio local (file:///repo.git): con GitHub se deja vacio.
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false ${JENKINS_EXTRA_OPTS:-}"
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8081/}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      # Repositorio local opcional (prueba antes del push). Con REPO_URL=file:///repo.git y LOCAL_REPO=<ruta del repo bare>
      - ${LOCAL_REPO:-./jenkins/.sin-repo-local}:/repo.git:ro
volumes:
  jenkins_home: {}
