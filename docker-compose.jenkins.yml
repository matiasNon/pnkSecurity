# Jenkins para la 4.a entrega. Levantar:  JENKINS_ADMIN_PASSWORD=... REPO_URL=... docker compose -f docker-compose.jenkins.yml up -d --build
# Abrir http://localhost:8080 (usuario admin). Los secretos de produccion viven en el volumen de Jenkins (carpeta pnk-secretos), nunca en el repo.
services:
  jenkins:
    build: ./jenkins
    container_name: pnk-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8080:8080"
    environment:
      JENKINS_ADMIN_PASSWORD: ${JENKINS_ADMIN_PASSWORD:?defina JENKINS_ADMIN_PASSWORD}
      REPO_URL: ${REPO_URL:-https://github.com/matiasNon/pnkSecurity.git}
      REPO_BRANCH: ${REPO_BRANCH:-carta-digital-node}
      JENKINS_URL: ${JENKINS_URL:-http://localhost:8080/}
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
volumes:
  jenkins_home: {}
