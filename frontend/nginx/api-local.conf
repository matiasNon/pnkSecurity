# Solo fuera de AWS (dev, QA y la EC2 unica): este mismo nginx reenvia la API y las fotos subidas al backend,
# asi el navegador ve un solo origen igual que detras del ALB. En AWS NO se monta (el ALB enruta por ruta).
location /api/ {
  proxy_pass http://backend:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  # Se SOBRESCRIBE con la IP real (no se agrega): el backend no confia en lo que mande el cliente.
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Connection "";
}
location /uploads/ {
  proxy_pass http://backend:3000;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header Connection "";
}
