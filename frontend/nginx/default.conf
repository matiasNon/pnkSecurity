# FRONTEND de la carta digital: solo archivos estaticos (HTML/CSS/JS/imagenes). Los datos los pide el navegador
# a la API del backend (/api/*), que en AWS recibe el balanceador (ALB) y envia al ASG del backend.
# En dev/QA/EC2 unica no hay ALB: el archivo extra/api-local.conf (montado por docker compose) reenvia /api y /uploads.

server_tokens off;

# HSTS solo si el visitante llego por HTTPS (el ALB o nginx TLS envian X-Forwarded-Proto).
map $http_x_forwarded_proto $hsts {
  https   "max-age=31536000; includeSubDomains";
  default "";
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  charset utf-8;
  client_max_body_size 3m;
  absolute_redirect off;

  include /etc/nginx/extra/*.conf;

  # Health check del balanceador y de Docker.
  location = /salud {
    access_log off;
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-store" always;
    default_type application/json;
    return 200 '{"estado":"ok","servicio":"frontend"}';
  }

  # Entrada y enlaces antiguos de los codigos QR (/index.php?id=N -> /restaurantes/N).
  location = / {
    include /etc/nginx/cabeceras.inc;
    return 302 /restaurantes/1;
  }
  location = /index.php {
    include /etc/nginx/cabeceras.inc;
    if ($arg_id ~ "^[0-9]{1,10}$") { return 301 /restaurantes/$arg_id; }
    return 404;
  }

  # Paginas: la URL limpia se resuelve a su HTML; cualquier otra forma (p. ej. "1 OR 1=1") cae en 404.
  location ~ "^/restaurantes/[0-9]{1,10}$" {
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
    try_files /carta.html =404;
  }
  location ~ "^/restaurantes/[0-9]{1,10}/carrito$" {
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
    try_files /carrito.html =404;
  }
  location = /admin {
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
    try_files /admin/panel.html =404;
  }
  location ~ "^/admin/(cartas|categorias|productos)$" {
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
    try_files /admin/lista.html =404;
  }
  location ~ "^/admin/(cartas|categorias|productos)/(nuevo|[0-9]{1,10}/editar)$" {
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
    try_files /admin/formulario.html =404;
  }

  # Recursos estaticos.
  location ~ "^/(css|js|vendors|img|imagenes)/" {
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "public, max-age=3600" always;
    try_files $uri =404;
  }

  # Los .html solo se sirven por las rutas de arriba.
  location / {
    include /etc/nginx/cabeceras.inc;
    return 404;
  }

  error_page 404 /error.html;
  location = /error.html {
    internal;
    include /etc/nginx/cabeceras.inc;
    add_header Cache-Control "no-cache" always;
  }
}
